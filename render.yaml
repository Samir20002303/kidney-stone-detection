services:
  - type: web
    name: nephroscan-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DEVICE
        value: cpu
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: MODEL_PATH
        value: /app/models/production/best.pt
