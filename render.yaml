services:
  - type: web
    name: kidney-stone-detection-api
    runtime: python
    repo: https://github.com/VOTRE-COMPTE/kidney-stone-detection
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0